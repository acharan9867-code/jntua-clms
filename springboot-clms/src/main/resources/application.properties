# ==============================================================================
# JNTUA Central Library Management System (CLMS)
# Spring Boot 3.x Configuration Profile
# ==============================================================================

server.port=8080
spring.application.name=jntua-clms

# ------------------------------------------------------------------------------
# MySQL Database Configuration (Primary Production / Submission)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/jntua_clms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA & Hibernate Settings
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# Thymeleaf Configuration
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------------------
# Static Resources
# ------------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/

# ------------------------------------------------------------------------------
# Library Business Logic Defaults
# ------------------------------------------------------------------------------
library.lending.period.days=15
library.fine.per.day=1.0
library.lost.damaged.penalty=300.0
library.max.books.student=3
library.max.books.faculty=6
library.max.books.admin=10
