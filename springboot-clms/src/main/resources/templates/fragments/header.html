<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' | JNTUA CLMS'">JNTUA CLMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>
<div th:fragment="navbar">
  <nav class="navbar navbar-expand-lg clms-navbar">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/catalog}">
        <img src="https://upload.wikimedia.org/wikipedia/en/e/e3/Jawaharlal_Nehru_Technological_University%2C_Anantapur_logo.png"
             alt="JNTUA" height="36" onerror="this.style.display='none'"/>
        <span class="fw-bold">JNTUA&nbsp;CLMS</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-center gap-1">
          <li class="nav-item"><a class="nav-link" th:href="@{/catalog}"><i class="bi bi-book me-1"></i>Catalog</a></li>
          <li class="nav-item" sec:authorize="hasAnyRole('STUDENT','FACULTY')">
            <a class="nav-link" th:href="@{/student/dashboard}"><i class="bi bi-person-lines-fill me-1"></i>My Dashboard</a>
          </li>
          <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:href="@{/admin/dashboard}"><i class="bi bi-shield-check me-1"></i>Admin Panel</a>
          </li>
          <li class="nav-item" sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post" class="d-inline">
              <button class="btn btn-outline-light btn-sm ms-2" type="submit">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
              </button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="clms-header-banner py-2 px-4 d-flex justify-content-between align-items-center">
    <span class="small"><i class="bi bi-clock me-1"></i>Mon–Sat: 8:30 AM – 6:30 PM | Sun &amp; Holidays: Closed</span>
    <span class="small fw-semibold">Dr. A.P.J. Abdul Kalam Central Library — JNTUA CEA</span>
    <span class="small" sec:authorize="isAuthenticated()">
      Logged in as: <strong sec:authentication="name"></strong>
    </span>
  </div>
</div>
<div th:fragment="footer">
  <footer class="clms-footer mt-5 py-3 text-center small">
    <div>&copy; 2024 JNTUA Central Library Management System</div>
    <div class="text-muted">Designed &amp; Developed by <strong>Charan Apilagunta</strong> &bull; JNTUA CSE</div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/main.js}"></script>
</div>
</body>
</html>
