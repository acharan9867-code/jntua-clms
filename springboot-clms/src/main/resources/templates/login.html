<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Sign In')}"></head>
<body class="clms-login-body">
<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-card shadow-lg">
    <!-- Header -->
    <div class="login-card-header text-center py-4">
      <img src="https://upload.wikimedia.org/wikipedia/en/e/e3/Jawaharlal_Nehru_Technological_University%2C_Anantapur_logo.png"
           alt="JNTUA Logo" height="64" class="mb-2" onerror="this.style.display='none'"/>
      <h4 class="fw-bold mb-0">JNTUA Central Library</h4>
      <p class="small mb-0 text-info">Dr. A.P.J. Abdul Kalam Library — Member Sign In</p>
    </div>

    <!-- Role Tabs -->
    <ul class="nav nav-pills nav-fill px-4 pt-3" id="loginTabs">
      <li class="nav-item">
        <button class="nav-link active" id="student-tab" data-bs-toggle="pill" data-bs-target="#studentForm">
          <i class="bi bi-mortarboard-fill me-1"></i>Student Login
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="librarian-tab" data-bs-toggle="pill" data-bs-target="#librarianForm">
          <i class="bi bi-shield-fill-check me-1"></i>Librarian Login
        </button>
      </li>
    </ul>

    <!-- Alerts -->
    <div class="px-4 pt-2">
      <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible py-2 small" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${logoutMsg}" class="alert alert-success py-2 small" role="alert">
        <i class="bi bi-check-circle-fill me-1"></i>
        <span th:text="${logoutMsg}"></span>
      </div>
    </div>

    <div class="tab-content px-4 pb-4 pt-2">
      <!-- Student Tab -->
      <div class="tab-pane fade show active" id="studentForm">
        <form th:action="@{/login}" method="post">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Gmail Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
              <input type="text" name="username" class="form-control"
                     placeholder="yourname@gmail.com or Roll No" required autofocus/>
            </div>
            <div class="form-text">Any Gmail auto-creates a student account on first login.</div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input type="password" name="password" class="form-control" placeholder="Your password" required/>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold">
            <i class="bi bi-box-arrow-in-right me-1"></i>Sign In as Student
          </button>
        </form>
        <!-- Demo Quick Logins -->
        <div class="mt-3 pt-3 border-top">
          <p class="small text-muted mb-2"><i class="bi bi-lightning-charge-fill text-warning me-1"></i>Quick Demo Logins (Viva)</p>
          <div class="d-grid gap-2">
            <form th:action="@{/login}" method="post">
              <input type="hidden" name="username" value="student.charan@gmail.com"/>
              <input type="hidden" name="password" value="jntua@123"/>
              <button type="submit" class="btn btn-outline-primary w-100 btn-sm">
                <i class="bi bi-mortarboard me-1"></i>Student: S. Charan Reddy
              </button>
            </form>
            <form th:action="@{/login}" method="post">
              <input type="hidden" name="username" value="fac.kavitha@jntua.ac.in"/>
              <input type="hidden" name="password" value="jntua@123"/>
              <button type="submit" class="btn btn-outline-secondary w-100 btn-sm">
                <i class="bi bi-person-badge me-1"></i>Faculty: Dr. K. Kavitha
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Librarian Tab -->
      <div class="tab-pane fade" id="librarianForm">
        <div class="alert alert-warning py-2 small mb-3">
          <i class="bi bi-shield-lock-fill me-1"></i>Authorized Library Personnel Only
        </div>
        <form th:action="@{/login}" method="post">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Librarian ID / Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-fill-gear"></i></span>
              <input type="text" name="username" class="form-control" placeholder="Enter Librarian ID" required/>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
              <input type="password" name="password" class="form-control" placeholder="••••••••••••" required/>
            </div>
          </div>
          <button type="submit" class="btn w-100 fw-bold btn-librarian">
            <i class="bi bi-shield-fill-check me-1"></i>Sign In as Librarian
          </button>
        </form>
      </div>
    </div>

    <div class="text-center pb-3 small text-muted">
      Designed &amp; Developed by <strong>Charan Apilagunta</strong> &bull; JNTUA CSE
    </div>
  </div>
</div>
</body>
</html>
