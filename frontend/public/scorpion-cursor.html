<!DOCTYPE html>
<html>
<head>
  <title>Animated Scorpion Cursor</title>

  <style>
    * {
      cursor: none;
    }

    body {
      margin: 0;
      height: 100vh;
      background: #050505;
      overflow: hidden;
      font-family: Arial;
    }

    .scorpion {
      position: fixed;
      width: 70px;
      height: 70px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 8px #ff6600);
    }

    /* Body */
    .body {
      position: absolute;
      width: 22px;
      height: 32px;
      background: #ff6500;
      border-radius: 50%;
      left: 24px;
      top: 27px;
      animation: breathe 0.5s infinite alternate;
    }

    /* Head */
    .head {
      position: absolute;
      width: 16px;
      height: 13px;
      background: #ff7b00;
      border-radius: 50%;
      left: 27px;
      top: 16px;
    }

    /* Tail */
    .tail {
      position: absolute;
      width: 38px;
      height: 42px;
      border: 5px solid #ff6500;
      border-left: none;
      border-bottom: none;
      border-radius: 50%;
      left: 30px;
      top: -8px;

      animation: tailMove 0.7s infinite alternate;
      transform-origin: bottom left;
    }

    /* Sting */
    .sting {
      position: absolute;
      width: 12px;
      height: 12px;
      background: red;
      border-radius: 50%;
      left: 55px;
      top: -12px;

      box-shadow:
        0 0 10px red,
        0 0 20px red;

      animation: sting 0.7s infinite alternate;
    }

    /* Claws */
    .claw {
      position: absolute;
      width: 20px;
      height: 12px;
      border: 4px solid #ff6500;
      border-radius: 50%;
      top: 18px;
    }

    .left-claw {
      left: 0;
      transform: rotate(-30deg);
      animation: leftClaw 0.5s infinite alternate;
    }

    .right-claw {
      right: 0;
      transform: rotate(30deg);
      animation: rightClaw 0.5s infinite alternate;
    }

    /* Legs */
    .leg {
      position: absolute;
      width: 25px;
      height: 4px;
      background: #ff6500;
      border-radius: 5px;
      transform-origin: left center;
    }

    .l1 {
      left: 25px;
      top: 34px;
      transform: rotate(150deg);
      animation: walk1 0.3s infinite alternate;
    }

    .l2 {
      left: 25px;
      top: 42px;
      transform: rotate(170deg);
      animation: walk2 0.3s infinite alternate;
    }

    .l3 {
      left: 25px;
      top: 50px;
      transform: rotate(195deg);
      animation: walk1 0.3s infinite alternate;
    }

    .r1 {
      left: 38px;
      top: 34px;
      transform: rotate(30deg);
      animation: walk2 0.3s infinite alternate;
    }

    .r2 {
      left: 38px;
      top: 42px;
      transform: rotate(10deg);
      animation: walk1 0.3s infinite alternate;
    }

    .r3 {
      left: 38px;
      top: 50px;
      transform: rotate(-15deg);
      animation: walk2 0.3s infinite alternate;
    }

    /* Particle */
    .particle {
      position: fixed;
      width: 5px;
      height: 5px;
      background: #ff6500;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 10px #ff6500;
    }

    /* Animations */

    @keyframes breathe {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.1);
      }
    }

    @keyframes tailMove {
      from {
        transform: rotate(-15deg);
      }

      to {
        transform: rotate(20deg);
      }
    }

    @keyframes sting {
      from {
        transform: scale(0.7);
      }

      to {
        transform: scale(1.4);
      }
    }

    @keyframes leftClaw {
      from {
        transform: rotate(-30deg);
      }

      to {
        transform: rotate(-50deg);
      }
    }

    @keyframes rightClaw {
      from {
        transform: rotate(30deg);
      }

      to {
        transform: rotate(50deg);
      }
    }

    @keyframes walk1 {
      from {
        transform: rotate(150deg);
      }

      to {
        transform: rotate(135deg);
      }
    }

    @keyframes walk2 {
      from {
        transform: rotate(170deg);
      }

      to {
        transform: rotate(185deg);
      }
    }
  </style>
</head>

<body>

  <div class="scorpion" id="scorpion">

    <div class="tail"></div>
    <div class="sting"></div>

    <div class="claw left-claw"></div>
    <div class="claw right-claw"></div>

    <div class="leg l1"></div>
    <div class="leg l2"></div>
    <div class="leg l3"></div>

    <div class="leg r1"></div>
    <div class="leg r2"></div>
    <div class="leg r3"></div>

    <div class="head"></div>
    <div class="body"></div>

  </div>


  <script>

    const scorpion = document.getElementById("scorpion");

    let mouseX = 0;
    let mouseY = 0;

    let currentX = 0;
    let currentY = 0;

    document.addEventListener("mousemove", (e) => {

      mouseX = e.clientX;
      mouseY = e.clientY;

      createParticle(mouseX, mouseY);

    });


    function animate() {

      currentX += (mouseX - currentX) * 0.12;
      currentY += (mouseY - currentY) * 0.12;

      scorpion.style.left = currentX + "px";
      scorpion.style.top = currentY + "px";

      requestAnimationFrame(animate);

    }

    animate();


    /* Particle Trail */

    function createParticle(x, y) {

      const particle = document.createElement("div");

      particle.classList.add("particle");

      particle.style.left = x + "px";
      particle.style.top = y + "px";

      document.body.appendChild(particle);

      particle.animate(
        [
          {
            opacity: 1,
            transform: "scale(1)"
          },
          {
            opacity: 0,
            transform: "scale(0)"
          }
        ],
        {
          duration: 500
        }
      );

      setTimeout(() => {
        particle.remove();
      }, 500);

    }

  </script>

</body>
</html>
